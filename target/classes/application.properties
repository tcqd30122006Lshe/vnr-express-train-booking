# Server Port
server.port=8080

# Application Name
spring.application.name=train-ticket-booking

# H2 Database Configuration (Chạy In-Memory tức thì, không cần cài MySQL)
spring.datasource.url=jdbc:h2:mem:trainticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.signerKey=18012026_TrainTicketBookingSystemSecretKeyForJWTAuthentication_99999999
jwt.valid-duration=900
jwt.refreshable-duration=604800

