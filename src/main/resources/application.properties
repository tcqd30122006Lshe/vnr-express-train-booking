# Server Port (Tự động nhận PORT từ Railway)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Application Name
spring.application.name=train-ticket-booking

# MySQL Database Configuration (Tự động nhận biến Railway, fallback localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ve_tau}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:12345678}}

# JPA / Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration (Lấy từ biến môi trường Railway, fallback cho dev)
jwt.signerKey=${JWT_SECRET:local_dev_jwt_secret_key_needs_to_be_long_enough_for_hs512_alg}
jwt.valid-duration=900
jwt.refreshable-duration=604800

# VNPAY SANDBOX CONFIGURATION (Đọc từ biến môi trường)
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-callback}
vnpay.tmnCode=${VNPAY_TMN_CODE:91X4SC1S}
vnpay.secretKey=${VNPAY_SECRET_KEY:FCCBXGAWHQTFYBDHVKHURVBPXNFUSYCB}
vnpay.version=2.1.0
vnpay.command=pay

